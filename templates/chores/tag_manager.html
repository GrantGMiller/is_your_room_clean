<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tag Manager | {{ app_name }}</title>
    {% include "js_css.html" %}
  </head>

  <body class="bg-light">
    {% include "flash_messages.html" %} {% include "navbar.html" %}
    <main class="container py-5">
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"
      >
        <div>
          <p class="text-uppercase text-muted small fw-semibold mb-2">
            Chores
          </p>
          <h1 class="h2 mb-1">Tag Manager</h1>
          <p class="text-muted mb-0">View and manage your chore tags.</p>
        </div>
        <a class="btn btn-outline-secondary" href="/chores/overview">
          Back to chores overview
        </a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Tag name</th>
              <th class="text-center" scope="col">Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for tag in tags %}
              <tr>
                <td>{{ tag }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm btn-success me-1"
                    type="button"
                    data-enabled="true"
                    data-tag-name="{{ tag }}"
                  >
                    ENABLE ALL
                  </button>
                  <button
                    class="btn btn-sm btn-danger"
                    type="button"
                    data-enabled="false"
                    data-tag-name="{{ tag }}"
                  >
                    DISABLE ALL
                  </button>
                </td>
              </tr>
            {% else %}
              <tr>
                <td class="text-muted" colspan="2">No tags found.</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </main>

    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      aria-live="polite"
      aria-atomic="true"
    >
      <div
        id="tag-update-toast"
        class="toast"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      >
        <div class="toast-header">
          <strong class="me-auto">Tag Manager</strong>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="toast"
            aria-label="Close"
          ></button>
        </div>
        <div class="toast-body" id="tag-update-toast-message"></div>
      </div>
    </div>

    <script>
      document
        .querySelectorAll("[data-tag-name][data-enabled]")
        .forEach((button) => {
          button.addEventListener("click", () =>
            setTagEnabled(button, button.dataset.tagName),
          );
        });

      async function setTagEnabled(button, tagName) {
        const enabled = button.dataset.enabled === "true";
        button.disabled = true;

        try {
          const response = await fetch("/chores/tags/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tag_name: tagName,
              enabled,
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Unable to update tag");
          }

          document.getElementById("tag-update-toast-message").textContent =
            `Tag "${result.tag_name}" ${result.enabled ? "enabled" : "disabled"}.`;
          bootstrap.Toast.getOrCreateInstance(
            document.getElementById("tag-update-toast"),
          ).show();
        } catch (error) {
          console.error("Error updating tag:", error);
          window.alert("Unable to update tag. Please try again.");
        } finally {
          button.disabled = false;
        }
      }
    </script>
  </body>
</html>
