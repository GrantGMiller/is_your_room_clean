<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tag Manager | {{ app_name }}</title>
    {% include "js_css.html" %}
  </head>

  <body class="bg-light">
    {% include "flash_messages.html" %} {% include "navbar.html" %}
    <main class="container py-5">
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"
      >
        <div>
          <p class="text-uppercase text-muted small fw-semibold mb-2">
            Chores
          </p>
          <h1 class="h2 mb-1">Tag Manager</h1>
          <p class="text-muted mb-0">View and manage your chore tags.</p>
        </div>
        <a class="btn btn-outline-secondary" href="/chores/overview">
          Back to chores overview
        </a>
      </div>

      <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
          <thead>
            <tr>
              <th scope="col">Tag name</th>
              <th class="text-center" scope="col">Status</th>
            </tr>
          </thead>
          <tbody>
            {% for tag in tags %}
              <tr>
                <td>{{ tag }}</td>
                <td class="text-center">
                  <button
                    class="btn btn-sm {{ 'btn-success' if user.is_tag_enabled(tag) else 'btn-danger' }}"
                    type="button"
                    data-tag-name="{{ tag }}"
                    data-enabled="{{ 'true' if user.is_tag_enabled(tag) else 'false' }}"
                    onclick="toggleTagEnabled(this)"
                  >
                    {{ 'Enabled' if user.is_tag_enabled(tag) else 'Disabled' }}
                  </button>
                </td>
              </tr>
            {% else %}
              <tr>
                <td class="text-muted" colspan="2">No tags found.</td>
              </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </main>

    <script>
      async function toggleTagEnabled(button) {
        const enabled = button.dataset.enabled !== "true";
        button.disabled = true;

        try {
          const response = await fetch("/chores/tags/toggle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              tag_name: button.dataset.tagName,
              enabled,
            }),
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "Unable to update tag");
          }

          button.dataset.enabled = String(result.enabled);
          button.textContent = result.enabled ? "Enabled" : "Disabled";
          button.classList.toggle("btn-success", result.enabled);
          button.classList.toggle("btn-danger", !result.enabled);
        } catch (error) {
          console.error("Error updating tag:", error);
          window.alert("Unable to update tag. Please try again.");
        } finally {
          button.disabled = false;
        }
      }
    </script>
  </body>
</html>
