<script>
  function openRingApp(event) {
    event.preventDefault();

    let appOpened = false;
    const markAppOpened = () => {
      appOpened = true;
    };

    window.addEventListener("blur", markAppOpened, { once: true });
    window.addEventListener("pagehide", markAppOpened, { once: true });
    window.location.href = "ring://";

    window.setTimeout(() => {
      if (!appOpened) {
        window.location.href = "https://ring.com";
      }
    }, 1500);
  }
</script>
