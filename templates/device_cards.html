<div class="row g-4" id="device-cards">
  {% set devices = ring_user.get_devices() %}
  {% if devices | length < 1 %}
    <div class="text-center">
      <p class="text">
        No devices found.
        <a href="https://account.ring.com/account/integrations"
          >Click here to make sure you have shared your devices with this
          app.</a
        >
      </p>

      <img
        class="img-fluid img-thumbnail w-50 d-block mx-auto"
        src="/static/enable_cameras.png"
      />
    </div>
  {% endif %}
  {% for device in devices %}
    <div class="col-12 col-sm-6 col-lg-4">
      <div class="card shadow-sm h-100">
        <div class="snapshot-frame position-relative">
          <img
            src="/get_snapshot/{{ device['id'] }}"
            class="card-img-top"
            id="snapshot-{{ device['id'] }}"
            alt="{{ device['attributes']['name'] }} snapshot"
            onload="imageLoaded('{{ device['id'] }}');"
            onerror="snapshotFailed(this);"
          />

          <span
            class="badge position-absolute bottom-0 end-0 m-2 fs-6"
            id="badge-{{ device['id'] }}"
          >
          </span>
        </div>
        <div
          class="card-body d-flex justify-content-between align-items-center"
        >
          <h2 class="h6 mb-0">{{ device['attributes']['name'] }}</h2>
          <small
            class="text-muted text-nowrap timestamp-text"
            id="timestamp-{{ device['id'] }}"
            hidden
          ></small>
        </div>
        <p
          class="text-muted m-2 summary-text"
          id="summary-{{ device['id'] }}"
          data-snapshot-id="snapshot-{{ device['id'] }}"
          hidden
        >
          <span
            class="spinner-border spinner-border-sm"
            role="status"
            aria-hidden="true"
          ></span>
          Analyzing room...
        </p>
      </div>
    </div>
  {% endfor %}
</div>

<script>
  const LOOP_TIME_MS = 8000;
  const SNAPSHOT_RETRY_TIME_MS = 3000;
  const MAX_NUM_REFRESHES = 5;
  const currentNumRefreshes = 0;

  function updateTimestampLabel(timestampEl) {
    const timestamp = Number(timestampEl.dataset.timestampEpochMs);
    const ageMs = Date.now() - timestamp;
    const minutes = Math.max(0, Math.floor(ageMs / 60000));
    timestampEl.textContent = `${minutes} minute${minutes === 1 ? "" : "s"} ago`;

    const lastRefreshAt = Number(
      timestampEl.dataset.lastSnapshotRefreshAt || 0,
    );
    if (
      Number.isFinite(timestamp) &&
      ageMs > 5 * 60 * 1000 &&
      Date.now() - lastRefreshAt > 5 * 60 * 1000
    ) {
      currentNumRefreshes += 1;
      if (currentNumRefreshes >= MAX_NUM_REFRESHES) {
        return;
      }
      timestampEl.dataset.lastSnapshotRefreshAt = Date.now();
      const deviceId = timestampEl.id.replace("timestamp-", "");
      const snapshotEl = document.getElementById("snapshot-" + deviceId);
      snapshotEl.src = snapshotEl.src.split("?")[0] + "?refresh=" + Date.now();
    }
  }

  function retrySnapshot(image) {
    window.setTimeout(
      function () {
        const separator = image.src.includes("?") ? "&" : "?";
        image.src = image.src.split("#")[0] + separator + "retry=" + Date.now();
      },
      SNAPSHOT_RETRY_TIME_MS + Math.random() * 2000,
    );
  }

  function snapshotFailed(image) {
    const deviceId = image.id.replace("snapshot-", "");
    const summaryEl = document.getElementById("summary-" + deviceId);
    summaryEl.hidden = false;
    summaryEl.replaceChildren(document.createTextNode("No Events Found — "));

    const link = document.createElement("a");
    link.href = "/no_events?supress_auto_redirect=true";
    link.textContent = "check Ring event settings";
    summaryEl.append(link);

    retrySnapshot(image);
  }

  function imageLoaded(deviceId) {
    document.getElementById("flash-messages")?.replaceChildren();

    const summaryEl = document.getElementById("summary-" + deviceId);
    summaryEl.hidden = false;
    summaryEl.textContent = "Analyzing room...";
    fetchSummary(deviceId);
  }

  function fetchSummary(deviceId) {
    const summaryEl = document.getElementById("summary-" + deviceId);
    const badgeEl = document.getElementById("badge-" + deviceId);

    fetch("/image/" + deviceId)
      .then(async function (resp) {
        if (!resp.ok) {
          throw new Error("Error " + resp.status);
        }
        const data = await resp.json();
        console.info("data=", data);
        if (data.summary == null) {
          throw new Error("Error missing summary");
        }
        return data;
      })
      .then(function (data) {
        summaryEl.textContent = data.summary;

        const timestampEl = document.getElementById("timestamp-" + deviceId);
        if (data.timestamp_epoch_ms != null) {
          timestampEl.dataset.timestampEpochMs = data.timestamp_epoch_ms;
          timestampEl.hidden = false;
          updateTimestampLabel(timestampEl);
        }

        badgeEl.textContent = `${data.cleanliness}% Clean`;

        if (data.cleanliness < 40) {
          badgeEl.classList.add("text-bg-danger");
        } else if (data.cleanliness < 70) {
          badgeEl.classList.add("text-bg-warning");
        } else {
          badgeEl.classList.add("text-bg-success");
        }
      })
      .catch(function (err) {
        console.error("Failed to load summary for device", deviceId, err);

        summaryEl.textContent = "Analyzing room...";

        // Try again in 10 seconds

        setTimeout(
          function () {
            fetchSummary(deviceId);
          },
          LOOP_TIME_MS + Math.random() * 2000,
        );
      });
  }

  window.setInterval(function () {
    document
      .querySelectorAll(".timestamp-text[data-timestamp-epoch-ms]")
      .forEach(updateTimestampLabel);
  }, 60000);
</script>
