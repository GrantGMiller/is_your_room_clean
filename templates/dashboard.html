                <p class="text-muted small m-1 summary-text" id="summary-{{ device['id'] }}"
                   data-snapshot-id="{{ snapshot_id }}">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Analyzing room...
                </p>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
    const LOOP_TIME_MS = 10000
    function pollSummary(snapshotId, targetEl) {
        fetch('/image/' + snapshotId + '/summary')
            .then(function (resp) {
                if (resp.status === 404) {
                    // Not ready yet -- try again in 5 seconds
                    setTimeout(function () { pollSummary(snapshotId, targetEl); }, LOOP_TIME_MS);
                    return null;
                }
                if (!resp.ok) {
                    throw new Error('Error ' + resp.status);
                }
                return resp.json();
            })
            .then(function (data) {
                if (data === null) return; // still waiting on the 404 retry
                targetEl.textContent = data.summary;

                const cEl = document.getElementById('badge-' + data.device_id)
                cEl.textContent = `${data.cleanliness}% Clean`
                if (data.cleanliness < 40){
                    cEl.classList.add('text-bg-danger')
                } else if (data.cleanliness < 70){
                    cEl.classList.add('text-bg-warning')
                } else {
                    cEl.classList.add('text-bg-success')
                }
            })
            .catch(function (err) {
                console.error('Failed to load summary for snapshot', snapshotId, err);
                targetEl.textContent = 'Unable to load summary.';
            });
    }

    document.querySelectorAll('.summary-text').forEach(function (el) {
        pollSummary(el.dataset.snapshotId, el);
    });

    document.querySelectorAll('.refresh-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
            e.stopPropagation();
            var deviceId = btn.dataset.deviceId;
            var img = document.getElementById('snapshot-' + deviceId);
            var badge = document.getElementById('badge-' + deviceId);
            var summaryEl = document.getElementById('summary-' + deviceId);

            btn.disabled = true;

            fetch('/refresh_snapshot/' + deviceId, { method: 'POST' })
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    img.src = '/image/' + data.snapshot_id + '?t=' + Date.now();
                    badge.textContent = data.cleanliness + '% clean';
                    badge.className = 'badge position-absolute bottom-0 end-0 m-2 fs-6 ' +
                        (data.cleanliness >= 70 ? 'text-bg-success'
                            : data.cleanliness >= 40 ? 'text-bg-warning'
                            : 'text-bg-danger');

                    summaryEl.dataset.snapshotId = data.snapshot_id;
                    summaryEl.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Analyzing room...';
                    pollSummary(data.snapshot_id, summaryEl);
                })
                .catch(function (err) {
                    console.error('Failed to refresh snapshot', err);
                })
                .finally(function () {
                    btn.disabled = false;
                });
        });
    });
</script>
<a class='btn btn-primary m-1' href="ring://">
