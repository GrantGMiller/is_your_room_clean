<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      {% if mode == 'add' %}
        Add Person
      {% else %}
        Edit {{ person.name }}
      {% endif %}
      | Is Your Room Clean
    </title>
    {% include "js_css.html" %}
  </head>
  <body class="bg-light">
    {% include "navbar.html" %}

    <main class="container py-5">
      <div
        class="d-flex flex-column flex-md-row justify-content-between align-items-md-end gap-3 mb-4"
      >
        <h1 class="h2 mb-0">
          {% if mode == 'add' %}
            Add Person
          {% else %}
            Edit "{{ person.name }}"
          {% endif %}
        </h1>
        <a class="btn btn-outline-secondary" href="/chores/overview"
          >Back to chores overview</a
        >
      </div>
      <form
        action="/chores/person/edit{% if mode == 'edit' %}?id={{ person.id }}{% endif %}"
        method="post"
      >
        <label class="form-label fw-semibold" for="person-name">Name</label>
        <input
          class="form-control"
          type="text"
          name="name"
          id="person-name"
          value="{% if person %}{{ person.name }}{% endif %}"
          maxlength="200"
          required
        />
        <label
          class="form-label fw-semibold mt-3 d-inline-block px-2 py-1 rounded border"
          id="person-color-label"
          for="person-color"
        >
          Color
        </label>
        <select class="form-select" name="color" id="person-color">
          {% for color in ["primary", "secondary", "success", "danger", "warning", "info", "light", "dark"] %}
            <option
              value="{{ color }}"
              {% if (person.get('color', 'primary') if person else 'primary') == color %}selected{% endif %}
            >
              {{ color | capitalize }}
            </option>
          {% endfor %}
        </select>
        {% if mode == 'add' %}
          <button class="btn btn-primary mt-3" type="submit">Save</button>
        {% endif %}
      </form>

      {% if mode == 'edit' %}
        <form
          class="mt-5"
          action="/chores/person/delete?id={{ person.id }}"
          method="post"
          onsubmit="return confirm('Are you sure you want to delete this person? This cannot be undone.');"
        >
          <button class="btn btn-outline-danger" type="submit">
            Delete person
          </button>
        </form>
      {% endif %}
    </main>
    <script>
      const personForm = document.querySelector("form");
      const personName = document.getElementById("person-name");
      const personColor = document.getElementById("person-color");
      const personColorLabel = document.getElementById("person-color-label");

      function updateColorLabel() {
        const color = personColor.value;
        personColorLabel.classList.remove(
          "bg-primary-subtle",
          "bg-secondary-subtle",
          "bg-success-subtle",
          "bg-danger-subtle",
          "bg-warning-subtle",
          "bg-info-subtle",
          "bg-light-subtle",
          "bg-dark-subtle",
          "border-primary",
          "border-secondary",
          "border-success",
          "border-danger",
          "border-warning",
          "border-info",
          "border-light",
          "border-dark",
        );
        personColorLabel.classList.add(
          `bg-${color}-subtle`,
          `border-${color}`,
        );
      }

      function savePerson() {
        fetch(personForm.action, {
          method: "POST",
          body: new FormData(personForm),
          headers: { "X-Requested-With": "XMLHttpRequest" },
        }).catch((error) => console.error("Error saving person:", error));
      }

      {% if mode == 'edit' %}
        personName.addEventListener("change", savePerson);
        personColor.addEventListener("change", savePerson);
      {% endif %}
      personColor.addEventListener("change", updateColorLabel);
      updateColorLabel();
    </script>
  </body>
</html>
